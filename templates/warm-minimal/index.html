<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scripture Short — Warm Minimal</title>

    <!--
      Self-hosted OFL fonts. No CDN call: this composition renders inside an
      offline job, and a missing font there would silently fall back to a
      system face — which for Devanagari means broken conjuncts rather than an
      obvious error.
    -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      /* ---------------------------------------------------------------
         Warm Minimal — editorial calm. One accent, wide whitespace.

         Every colour, face and size reads a --t-* custom property with the
         style's own default as fallback, so the same frozen template serves
         both its designed look and any one-click theme.
         --------------------------------------------------------------- */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { width: 1080px; height: 1920px; background: var(--t-bg, #f6f1e7); }

      #short {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: var(--t-font-body, 'Inter', system-ui, sans-serif);
        color: var(--t-ink, #221e19);
      }

      /* Full-bleed fill on a CHILD, never the root: the frame compositor can
         drop a root background and render black. */
      #ground { position: absolute; inset: 0; background: var(--t-bg, #f6f1e7); }

      /* ---- background variants, all CSS-generated ---- */
      #bg-fx { position: absolute; inset: -60px; }

      [data-bg='plain'] #bg-fx { display: none; }

      [data-bg='grain'] #bg-fx {
        opacity: 0.5;
        background-image:
          radial-gradient(circle at 20% 15%, color-mix(in srgb, var(--t-accent, #b4552e) 7%, transparent), transparent 45%),
          radial-gradient(circle at 82% 78%, color-mix(in srgb, var(--t-ink, #221e19) 6%, transparent), transparent 40%);
      }

      [data-bg='mesh'] #bg-fx {
        opacity: 0.55;
        background-image:
          radial-gradient(620px 620px at 18% 22%, color-mix(in srgb, var(--t-accent, #b4552e) 16%, transparent), transparent 70%),
          radial-gradient(700px 700px at 85% 30%, color-mix(in srgb, var(--t-soft, #6b6157) 14%, transparent), transparent 72%),
          radial-gradient(760px 760px at 50% 92%, color-mix(in srgb, var(--t-accent, #b4552e) 10%, transparent), transparent 75%);
      }

      [data-bg='rays'] #bg-fx {
        opacity: 0.16;
        background: conic-gradient(
          from 195deg at 50% -12%,
          transparent 0 14deg,
          var(--t-accent, #b4552e) 15deg 17deg,
          transparent 18deg 30deg,
          var(--t-accent, #b4552e) 31deg 32deg,
          transparent 33deg 48deg,
          var(--t-accent, #b4552e) 49deg 51deg,
          transparent 52deg 72deg,
          var(--t-accent, #b4552e) 73deg 74deg,
          transparent 75deg 360deg
        );
      }

      #particles { position: absolute; inset: 0; }
      [data-bg='particles'] ~ * .particle { }
      .particle {
        position: absolute;
        border-radius: 50%;
        background: var(--t-accent, #b4552e);
        opacity: 0;
      }

      .clip { position: absolute; inset: 0; }

      /* ---- reference bar, pinned while the verse is on screen ---- */
      #reference-bar {
        position: absolute;
        top: 96px;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        font-size: calc(34px * var(--t-scale, 1));
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--t-accent, #b4552e);
        opacity: 0;
      }

      /* The quiet form of the integrity claim: a check that only exists when
         the rendered verse matched the API response. Not a copyright block. */
      #verified-mark { width: calc(30px * var(--t-scale, 1)); height: calc(30px * var(--t-scale, 1)); }

      /* ---- stage: device text, then the verse, same grid cell ---- */
      #stage {
        position: absolute;
        top: 200px;
        left: 96px;
        right: 96px;
        bottom: 560px;
        display: grid;
        align-content: center;
      }

      #device, #verse-panel { grid-area: 1 / 1; align-self: center; }

      #device {
        font-family: var(--t-font-display, 'Fraunces', Georgia, serif);
        font-size: calc(76px * var(--t-scale, 1));
        line-height: 1.22;
        letter-spacing: -0.015em;
        opacity: 0;
      }
      #device .w { display: inline-block; opacity: 0; }

      #verse-panel { opacity: 0; }

      #verse-rule {
        width: 0;
        height: 3px;
        background: var(--t-accent, #b4552e);
        margin-bottom: 44px;
      }

      /* Marked for the integrity gate: textContent is diffed against the API
         response. Nothing may be interpolated in here. */
      #verse-text {
        font-family: var(--t-font-display, 'Fraunces', Georgia, serif);
        font-size: calc(72px * var(--t-scale, 1));
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      /* Complex scripts stack marks above and below the baseline; at these
         sizes the default leading collides. There is no Devanagari poster
         face, so the display font is overridden rather than faked. */
      #short[data-script='devanagari'] #verse-text,
      #short[data-script='bengali'] #verse-text {
        font-family: 'Noto Serif Devanagari', serif;
        font-size: calc(64px * var(--t-scale, 1));
        line-height: 1.62;
        letter-spacing: 0;
      }
      #short[data-script='devanagari'] #device,
      #short[data-script='bengali'] #device {
        font-family: 'Noto Serif Devanagari', serif;
        font-size: calc(64px * var(--t-scale, 1));
        line-height: 1.55;
      }
      #short[data-dir='rtl'] #stage,
      #short[data-dir='rtl'] #caption-rail { direction: rtl; }

      /* ---- caption rail ---- */
      #caption-rail {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 220px;
        min-height: 220px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      /* One line visible at a time, switched by zero-duration boundary sets —
         two lines crossfading in the same box is an illegible overlap. */
      .caption-line {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        font-size: calc(46px * var(--t-scale, 1));
        line-height: 1.4;
        font-weight: 600;
        color: var(--t-soft, #6b6157);
        opacity: 0;
        visibility: hidden;
        text-align: center;
      }
      #short[data-script='devanagari'] .caption-line {
        font-family: 'Noto Serif Devanagari', serif;
        line-height: 1.7;
      }
      .caption-line .cw.on { color: var(--t-ink, #221e19); }
    </style>
  </head>

  <body>
    <div
      id="short"
      data-composition-id="scripture-short"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="30"
      data-script="latin"
      data-dir="ltr"
    >
      <div id="ground"></div>
      <div id="bg-fx"></div>
      <div id="particles"></div>

      <!-- The framework owns media playback; this must exist in static markup.
           The bake step rewrites src, or removes the element entirely. -->
      <audio id="narration" data-narration data-start="0" preload="auto" src=""></audio>

      <div class="clip" data-start="0" data-duration="30" data-track-index="0">
        <div id="reference-bar">
          <svg id="verified-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2 3 6v6c0 5 3.8 9.3 9 10 5.2-.7 9-5 9-10V6l-9-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
            <path d="m8.5 12 2.5 2.5 4.5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span id="reference-label"></span>
        </div>

        <div id="stage">
          <div id="device"></div>
          <div id="verse-panel">
            <div id="verse-rule"></div>
            <div id="verse-text" data-verse-text></div>
          </div>
        </div>

        <div id="caption-rail"></div>
      </div>
    </div>

    <script id="short-spec" type="application/json">
      {}
    </script>
    <script src="/vendor/gsap.min.js"></script>
    <script>
      /* ==================================================================
         Pure function of the ShortSpec. One paused timeline, built
         synchronously. No clocks, no network, no unseeded randomness.
         ================================================================== */
      (function () {
        'use strict';

        var spec =
          window.__SHORT_SPEC__ ||
          JSON.parse(document.getElementById('short-spec').textContent || '{}');
        if (!spec || !spec.passage) return;
        window.__SHORT_SPEC__ = spec;

        var root = document.getElementById('short');
        var narration = spec.narration || {};
        var timings = narration.timings || [];
        var segments = narration.segments || [];
        var duration = Number(spec.durationSec || narration.durationSec || 30);

        root.setAttribute('data-duration', String(duration));
        root.setAttribute('data-script', spec.script || 'latin');
        root.setAttribute('data-dir', spec.dir || 'ltr');

        /* Deterministic PRNG — unseeded Math.random is banned because a seek
           to frame N must always produce the same frame N. */
        function mulberry32(seed) {
          return function () {
            seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
            var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rand = mulberry32(
          String(spec.id || 'short').split('').reduce(function (a, c) {
            return (a * 31 + c.charCodeAt(0)) | 0;
          }, 7)
        );

        /* ---- content -------------------------------------------------- */
        document.getElementById('verse-text').textContent = spec.passage.text;
        document.getElementById('reference-label').textContent =
          spec.passage.reference;

        var deviceEl = document.getElementById('device');
        var deviceWords = String((spec.device && spec.device.content) || '')
          .split(/\s+/).filter(Boolean);
        deviceWords.forEach(function (word, i) {
          var span = document.createElement('span');
          span.className = 'w';
          span.textContent = word;
          deviceEl.appendChild(span);
          if (i < deviceWords.length - 1) deviceEl.appendChild(document.createTextNode(' '));
        });
        var deviceSpans = deviceEl.querySelectorAll('.w');

        /* ---- particles (built only when the theme asks) ---------------- */
        var particles = [];
        if (root.getAttribute('data-bg') === 'particles') {
          var holder = document.getElementById('particles');
          for (var p = 0; p < 26; p += 1) {
            var dot = document.createElement('div');
            dot.className = 'particle';
            var size = 4 + rand() * 10;
            dot.style.width = size + 'px';
            dot.style.height = size + 'px';
            dot.style.left = (rand() * 1080) + 'px';
            dot.style.top = (1500 + rand() * 500) + 'px';
            holder.appendChild(dot);
            particles.push({ el: dot, drift: 500 + rand() * 900, sway: (rand() - 0.5) * 160, delay: rand() * duration * 0.6, peak: 0.14 + rand() * 0.3 });
          }
        }

        /* ---- caption rail ---------------------------------------------- */
        var MAX_CHARS = 34, MAX_WORDS = 7;
        var lines = [], current = null;
        for (var i = 0; i < timings.length; i += 1) {
          var t = timings[i];
          var wouldBe = current ? current.chars + 1 + t.word.length : t.word.length;
          if (!current || wouldBe > MAX_CHARS || current.words.length >= MAX_WORDS) {
            current = { words: [], chars: 0, start: t.start, end: t.end };
            lines.push(current);
          }
          current.words.push({ index: i, word: t.word, start: t.start, end: t.end });
          current.chars = current.chars === 0 ? t.word.length : current.chars + 1 + t.word.length;
          current.end = t.end;
        }

        var rail = document.getElementById('caption-rail');
        lines.forEach(function (line, li) {
          var el = document.createElement('div');
          el.className = 'caption-line';
          el.id = 'cl-' + li;
          line.words.forEach(function (w, wi) {
            var span = document.createElement('span');
            span.className = 'cw';
            span.id = 'cw-' + w.index;
            span.textContent = w.word;
            el.appendChild(span);
            if (wi < line.words.length - 1) el.appendChild(document.createTextNode(' '));
          });
          rail.appendChild(el);
          line.el = el;
        });

        /* ---- timing landmarks ------------------------------------------ */
        function rangeOf(kind) {
          for (var s = 0; s < segments.length; s += 1) {
            if (segments[s].kind !== kind) continue;
            var first = timings[segments[s].wordStart];
            var last = timings[segments[s].wordEnd - 1];
            if (first && last) return { start: first.start, end: last.end };
          }
          return null;
        }
        var deviceRange = rangeOf('device') || { start: 0, end: duration * 0.4 };
        var verseRange = rangeOf('verse') || { start: duration * 0.45, end: duration };
        var seam = Math.max(0.9, verseRange.start - 0.55);

        /* ---- the single paused timeline --------------------------------- */
        var tl = gsap.timeline({ paused: true });

        // The film's current: the ground effects drift for the whole piece.
        tl.fromTo('#bg-fx',
          { xPercent: -1.4, yPercent: -1, scale: 1.05, rotation: -0.4 },
          { xPercent: 1.4, yPercent: 1, scale: 1, rotation: 0.4, duration: duration, ease: 'none' }, 0);

        particles.forEach(function (pt, idx) {
          var travel = Math.min(duration - pt.delay, duration * 0.9);
          tl.fromTo(pt.el,
            { y: 0, x: 0, opacity: 0 },
            { y: -pt.drift, x: pt.sway, opacity: pt.peak, duration: travel * 0.35, ease: 'power1.out' }, pt.delay);
          tl.to(pt.el,
            { y: -pt.drift * 2.2, x: pt.sway * 1.6, opacity: 0, duration: travel * 0.65, ease: 'power1.in' },
            pt.delay + travel * 0.35);
          if (idx === 0) void 0; // keep linter quiet about unused idx
        });

        // Device entry: waterfall — words arrive as a staggered cascade,
        // each dropping a touch and settling with a decelerating ease.
        var deviceSpan = Math.max(0.6, deviceRange.end - deviceRange.start);
        tl.set('#device', { opacity: 1 }, Math.max(0, deviceRange.start - 0.35));
        tl.fromTo(deviceSpans,
          { opacity: 0, y: 42, rotationX: -18 },
          { opacity: 1, y: 0, rotationX: 0, duration: 0.55, ease: 'power4.out',
            stagger: Math.min(0.08, (deviceSpan * 0.5) / Math.max(1, deviceSpans.length)) },
          Math.max(0, deviceRange.start - 0.35));

        // The seam: a zoom-through. The device accelerates toward the camera
        // and blurs out; the verse decelerates up from just behind the plane.
        // Mirrored power4 eases and opposite scale signs make it read as one
        // continuous camera move rather than two unrelated fades.
        tl.to('#device', {
          opacity: 0, scale: 1.16, filter: 'blur(10px)',
          duration: 0.5, ease: 'power4.in',
        }, seam - 0.5);

        // Stillness before the climax: nothing moves on the stage for a beat.
        tl.fromTo('#verse-panel',
          { opacity: 0, scale: 0.94, y: 26, filter: 'blur(8px)' },
          { opacity: 1, scale: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power4.out', immediateRender: false },
          seam + 0.18);
        tl.fromTo('#verse-rule',
          { width: 0 },
          { width: 168, duration: 0.7, ease: 'power2.out' }, seam + 0.3);

        // Reference + verified mark rise with the verse and stay pinned.
        tl.fromTo('#reference-bar',
          { opacity: 0, y: -14 },
          { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, seam + 0.1);

        // Captions: hard-cut lines; the spoken word lifts to full ink.
        lines.forEach(function (line, li) {
          var lineIn = line.start;
          var lineOut = li === lines.length - 1 ? duration : lines[li + 1].start;
          tl.set(line.el, { autoAlpha: 1 }, lineIn);
          tl.fromTo(line.el, { y: 12 }, { y: 0, duration: 0.26, ease: 'power2.out', immediateRender: false }, lineIn);
          tl.set(line.el, { autoAlpha: 0 }, lineOut);
          line.words.forEach(function (w) {
            var el = document.getElementById('cw-' + w.index);
            tl.to(el, { color: 'var(--t-ink, #221e19)', duration: 0.06, ease: 'none' }, Math.max(0, w.start));
            tl.to(el, { color: 'var(--t-soft, #6b6157)', duration: 0.18, ease: 'none' }, Math.max(0.06, w.end));
          });
        });

        window.__timelines = window.__timelines || {};
        window.__timelines['scripture-short'] = tl;

        /* Client-side mirror of the integrity gate, for the preview badge. */
        window.__verifyVerse = function () {
          var rendered = document.getElementById('verse-text').textContent || '';
          var norm = function (s) {
            return s.normalize('NFC')
              .replace(/[﻿­‎‏‪-‮⁦-⁩]/g, '')
              .replace(/\s+/g, ' ')
              .trim();
          };
          return norm(rendered) === norm(spec.passage.text);
        };
      })();
    </script>
  </body>
</html>
