<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scripture Short — Neon Night</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      /* ---------------------------------------------------------------
         Neon Night — dark gradient, glow, a flare at the turn.

         The glow itself is static CSS (text-shadow is not seek-safe to
         animate); everything that moves does so through transform, opacity
         and filter only.
         --------------------------------------------------------------- */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { width: 1080px; height: 1920px; background: var(--t-bg, #160b1f); }

      #short {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: var(--t-font-body, 'Space Grotesk', system-ui, sans-serif);
        color: var(--t-ink, #fff4fa);
      }

      #ground {
        position: absolute; inset: 0;
        background:
          radial-gradient(900px 1300px at 50% 118%, color-mix(in srgb, var(--t-accent, #ff4d9d) 20%, transparent), transparent 70%),
          radial-gradient(1100px 900px at 50% -18%, color-mix(in srgb, var(--t-accent, #ff4d9d) 9%, transparent), transparent 65%),
          var(--t-bg, #160b1f);
      }

      #bg-fx { position: absolute; inset: -60px; }
      [data-bg='plain'] #bg-fx { display: none; }
      [data-bg='grain'] #bg-fx {
        opacity: 0.5;
        background-image:
          radial-gradient(circle at 24% 20%, color-mix(in srgb, var(--t-accent, #ff4d9d) 10%, transparent), transparent 44%),
          radial-gradient(circle at 78% 76%, color-mix(in srgb, var(--t-ink, #fff4fa) 5%, transparent), transparent 40%);
      }
      [data-bg='mesh'] #bg-fx {
        opacity: 0.65;
        background-image:
          radial-gradient(680px 680px at 16% 24%, color-mix(in srgb, var(--t-accent, #ff4d9d) 20%, transparent), transparent 70%),
          radial-gradient(720px 720px at 86% 30%, color-mix(in srgb, var(--t-soft, #a58fb8) 16%, transparent), transparent 72%),
          radial-gradient(820px 820px at 48% 94%, color-mix(in srgb, var(--t-accent, #ff4d9d) 13%, transparent), transparent 75%);
      }
      [data-bg='rays'] #bg-fx {
        opacity: 0.2;
        background: conic-gradient(from 196deg at 50% -10%,
          transparent 0 12deg, color-mix(in srgb, var(--t-accent, #ff4d9d) 55%, transparent) 13deg 15deg,
          transparent 16deg 30deg, color-mix(in srgb, var(--t-accent, #ff4d9d) 55%, transparent) 31deg 32deg,
          transparent 33deg 49deg, color-mix(in srgb, var(--t-accent, #ff4d9d) 55%, transparent) 50deg 52deg,
          transparent 53deg 73deg, color-mix(in srgb, var(--t-accent, #ff4d9d) 55%, transparent) 74deg 75deg,
          transparent 76deg 360deg);
      }
      #particles { position: absolute; inset: 0; }
      .particle {
        position: absolute; border-radius: 50%;
        background: var(--t-accent, #ff4d9d);
        box-shadow: 0 0 14px color-mix(in srgb, var(--t-accent, #ff4d9d) 80%, transparent);
        opacity: 0;
      }

      /* The flare that performs the seam. */
      #flare {
        position: absolute; inset: 0;
        background: radial-gradient(closest-side at 50% 46%, color-mix(in srgb, var(--t-accent, #ff4d9d) 42%, transparent), transparent 72%);
        opacity: 0;
        pointer-events: none;
      }

      .clip { position: absolute; inset: 0; }

      /* ---- device ---- */
      #stage {
        position: absolute;
        top: 190px; left: 96px; right: 96px; bottom: 620px;
        display: grid; align-content: center;
      }
      #device, #verse-panel { grid-area: 1 / 1; align-self: center; }

      #device {
        font-family: var(--t-font-display, 'Space Grotesk', sans-serif);
        font-weight: 700;
        font-size: calc(78px * var(--t-scale, 1));
        line-height: 1.16;
        letter-spacing: -0.01em;
        text-shadow: 0 0 34px color-mix(in srgb, var(--t-accent, #ff4d9d) 34%, transparent);
        opacity: 0;
      }
      #device .w { display: inline-block; opacity: 0; }
      #device .w.hot { color: var(--t-accent, #ff4d9d); }

      /* ---- verse: a glass slab with a glowing spine ---- */
      #verse-panel { opacity: 0; }
      #verse-card {
        position: relative;
        padding: 64px 56px 58px 66px;
        background: color-mix(in srgb, var(--t-ink, #fff4fa) 5%, transparent);
        border: 1px solid color-mix(in srgb, var(--t-accent, #ff4d9d) 45%, transparent);
        border-radius: 26px;
        box-shadow:
          0 0 60px color-mix(in srgb, var(--t-accent, #ff4d9d) 18%, transparent),
          inset 0 0 42px color-mix(in srgb, var(--t-accent, #ff4d9d) 7%, transparent);
      }
      #verse-spine {
        position: absolute; left: 0; top: 60px; bottom: 60px; width: 4px;
        background: var(--t-accent, #ff4d9d);
        box-shadow: 0 0 22px var(--t-accent, #ff4d9d);
        border-radius: 2px;
        transform-origin: top center;
      }
      #verse-text {
        font-family: var(--t-font-display, 'Space Grotesk', sans-serif);
        font-weight: 600;
        font-size: calc(58px * var(--t-scale, 1));
        line-height: 1.32;
      }
      #verse-text.longer { font-size: calc(46px * var(--t-scale, 1)); }

      #short[data-script='devanagari'] #verse-text,
      #short[data-script='bengali'] #verse-text {
        font-family: 'Noto Serif Devanagari', serif;
        line-height: 1.62;
        font-size: calc(52px * var(--t-scale, 1));
      }
      #short[data-script='devanagari'] #device,
      #short[data-script='bengali'] #device {
        font-family: 'Noto Serif Devanagari', serif;
        font-size: calc(64px * var(--t-scale, 1));
        line-height: 1.5;
      }
      #short[data-dir='rtl'] #stage, #short[data-dir='rtl'] #caption-rail { direction: rtl; }

      /* ---- reference chip ---- */
      #reference-bar {
        position: absolute;
        top: 96px; left: 0; right: 0;
        display: flex; align-items: center; justify-content: center; gap: 12px;
        font-size: calc(30px * var(--t-scale, 1));
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--t-accent, #ff4d9d);
        text-shadow: 0 0 24px color-mix(in srgb, var(--t-accent, #ff4d9d) 55%, transparent);
        opacity: 0;
      }
      #reference-bar svg { width: calc(28px * var(--t-scale, 1)); height: calc(28px * var(--t-scale, 1)); }

      /* ---- caption rail ---- */
      #caption-rail {
        position: absolute;
        left: 96px; right: 96px; bottom: 210px;
        min-height: 200px;
        display: flex; flex-direction: column; justify-content: flex-end;
      }
      .caption-line {
        position: absolute; left: 0; right: 0; bottom: 0;
        font-size: calc(44px * var(--t-scale, 1));
        line-height: 1.4;
        font-weight: 600;
        color: var(--t-soft, #a58fb8);
        opacity: 0; visibility: hidden;
        text-align: center;
      }
      #short[data-script='devanagari'] .caption-line {
        font-family: 'Noto Serif Devanagari', serif; line-height: 1.7;
      }
    </style>
  </head>

  <body>
    <div id="short" data-composition-id="scripture-short"
      data-width="1080"
      data-height="1920"
      data-start="0" data-duration="30" data-script="latin" data-dir="ltr">
      <div id="ground"></div>
      <div id="bg-fx"></div>
      <div id="particles"></div>
      <div id="flare"></div>

      <audio id="narration" data-narration data-start="0" preload="auto" src=""></audio>

      <div class="clip" data-start="0" data-duration="30" data-track-index="0">
        <div id="reference-bar">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2 3 6v6c0 5 3.8 9.3 9 10 5.2-.7 9-5 9-10V6l-9-4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            <path d="m8.5 12 2.5 2.5 4.5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span id="reference-label"></span>
        </div>

        <div id="stage">
          <div id="device"></div>
          <div id="verse-panel">
            <div id="verse-card">
              <div id="verse-spine"></div>
              <div id="verse-text" data-verse-text></div>
            </div>
          </div>
        </div>

        <div id="caption-rail"></div>
      </div>
    </div>

    <script id="short-spec" type="application/json">
      {}
    </script>
    <script src="/vendor/gsap.min.js"></script>
    <script>
      (function () {
        'use strict';

        var spec = window.__SHORT_SPEC__ ||
          JSON.parse(document.getElementById('short-spec').textContent || '{}');
        if (!spec || !spec.passage) return;
        window.__SHORT_SPEC__ = spec;

        var root = document.getElementById('short');
        var narration = spec.narration || {};
        var timings = narration.timings || [];
        var segments = narration.segments || [];
        var duration = Number(spec.durationSec || narration.durationSec || 30);

        root.setAttribute('data-duration', String(duration));
        root.setAttribute('data-script', spec.script || 'latin');
        root.setAttribute('data-dir', spec.dir || 'ltr');

        function mulberry32(seed) {
          return function () {
            seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
            var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rand = mulberry32(String(spec.id || 'short').split('').reduce(function (a, c) {
          return (a * 31 + c.charCodeAt(0)) | 0;
        }, 29));

        /* ---- content ---------------------------------------------------- */
        var verseEl = document.getElementById('verse-text');
        verseEl.textContent = spec.passage.text;
        if (spec.passage.text.length > 220) verseEl.classList.add('longer');
        document.getElementById('reference-label').textContent = spec.passage.reference;

        var deviceEl = document.getElementById('device');
        String((spec.device && spec.device.content) || '')
          .split(/\s+/).filter(Boolean)
          .forEach(function (word, i, all) {
            var span = document.createElement('span');
            span.className = 'w' + (rand() < 0.18 ? ' hot' : '');
            span.textContent = word;
            deviceEl.appendChild(span);
            if (i < all.length - 1) deviceEl.appendChild(document.createTextNode(' '));
          });
        var deviceSpans = deviceEl.querySelectorAll('.w');

        /* Neon always drifts: particles are part of the style's identity, on
           top of whatever background variant the theme chose. */
        var holder = document.getElementById('particles');
        var particles = [];
        for (var p = 0; p < 34; p += 1) {
          var dot = document.createElement('div');
          dot.className = 'particle';
          var size = 3 + rand() * 9;
          dot.style.width = size + 'px';
          dot.style.height = size + 'px';
          dot.style.left = (rand() * 1080) + 'px';
          dot.style.top = (1450 + rand() * 550) + 'px';
          holder.appendChild(dot);
          particles.push({ el: dot, drift: 600 + rand() * 1000, sway: (rand() - 0.5) * 220, delay: rand() * duration * 0.65, peak: 0.2 + rand() * 0.4 });
        }

        /* ---- caption rail ------------------------------------------------ */
        var MAX_CHARS = 34, MAX_WORDS = 7;
        var lines = [], current = null;
        for (var i = 0; i < timings.length; i += 1) {
          var t = timings[i];
          var wouldBe = current ? current.chars + 1 + t.word.length : t.word.length;
          if (!current || wouldBe > MAX_CHARS || current.words.length >= MAX_WORDS) {
            current = { words: [], chars: 0, start: t.start, end: t.end };
            lines.push(current);
          }
          current.words.push({ index: i, word: t.word, start: t.start, end: t.end });
          current.chars = current.chars === 0 ? t.word.length : current.chars + 1 + t.word.length;
          current.end = t.end;
        }
        var rail = document.getElementById('caption-rail');
        lines.forEach(function (line, li) {
          var el = document.createElement('div');
          el.className = 'caption-line';
          el.id = 'cl-' + li;
          line.words.forEach(function (w, wi) {
            var span = document.createElement('span');
            span.className = 'cw';
            span.id = 'cw-' + w.index;
            span.textContent = w.word;
            el.appendChild(span);
            if (wi < line.words.length - 1) el.appendChild(document.createTextNode(' '));
          });
          rail.appendChild(el);
          line.el = el;
        });

        function rangeOf(kind) {
          for (var s = 0; s < segments.length; s += 1) {
            if (segments[s].kind !== kind) continue;
            var first = timings[segments[s].wordStart];
            var last = timings[segments[s].wordEnd - 1];
            if (first && last) return { start: first.start, end: last.end };
          }
          return null;
        }
        var deviceRange = rangeOf('device') || { start: 0, end: duration * 0.4 };
        var verseRange = rangeOf('verse') || { start: duration * 0.45, end: duration };
        var seam = Math.max(0.9, verseRange.start - 0.55);

        /* ---- timeline ----------------------------------------------------- */
        var tl = gsap.timeline({ paused: true });

        tl.fromTo('#bg-fx',
          { xPercent: -1.8, yPercent: -1.4, scale: 1.07, rotation: -0.5 },
          { xPercent: 1.8, yPercent: 1.4, scale: 1, rotation: 0.5, duration: duration, ease: 'none' }, 0);
        // The ground glow slowly breathes upward across the whole piece — the
        // current the rest of the film floats on.
        tl.fromTo('#ground', { scale: 1.03, yPercent: 1 }, { scale: 1, yPercent: -0.6, duration: duration, ease: 'none' }, 0);

        particles.forEach(function (pt) {
          var travel = Math.min(duration - pt.delay, duration * 0.9);
          tl.fromTo(pt.el, { y: 0, x: 0, opacity: 0 },
            { y: -pt.drift, x: pt.sway, opacity: pt.peak, duration: travel * 0.35, ease: 'power1.out' }, pt.delay);
          tl.to(pt.el, { y: -pt.drift * 2.3, x: pt.sway * 1.7, opacity: 0, duration: travel * 0.65, ease: 'power1.in' },
            pt.delay + travel * 0.35);
        });

        // Device: waterfall entry, floating up out of the glow.
        var deviceSpan = Math.max(0.6, deviceRange.end - deviceRange.start);
        tl.set('#device', { opacity: 1 }, Math.max(0, deviceRange.start - 0.35));
        tl.fromTo(deviceSpans,
          { opacity: 0, y: 46, filter: 'blur(6px)' },
          { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.6, ease: 'power4.out',
            stagger: Math.min(0.09, (deviceSpan * 0.5) / Math.max(1, deviceSpans.length)) },
          Math.max(0, deviceRange.start - 0.35));

        // Seam: the flare fires, the device rides it out toward camera, and
        // the verse slab condenses out of the light.
        tl.fromTo('#flare', { opacity: 0 }, { opacity: 0.85, duration: 0.28, ease: 'power2.in', immediateRender: false }, seam - 0.3);
        tl.to('#flare', { opacity: 0, duration: 0.7, ease: 'power2.out' }, seam);
        tl.to('#device', { opacity: 0, scale: 1.18, filter: 'blur(12px)', duration: 0.45, ease: 'power4.in' }, seam - 0.4);
        tl.fromTo('#verse-panel',
          { opacity: 0, scale: 0.92, filter: 'blur(10px)' },
          { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.7, ease: 'power4.out', immediateRender: false },
          seam + 0.08);
        tl.fromTo('#verse-spine', { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: 'power3.out', immediateRender: false }, seam + 0.3);

        tl.fromTo('#reference-bar', { opacity: 0, y: -14 },
          { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, seam + 0.15);

        // Captions: hard cut lines; spoken word glows up to accent.
        lines.forEach(function (line, li) {
          var lineIn = line.start;
          var lineOut = li === lines.length - 1 ? duration : lines[li + 1].start;
          tl.set(line.el, { autoAlpha: 1 }, lineIn);
          tl.fromTo(line.el, { y: 12 }, { y: 0, duration: 0.26, ease: 'power2.out', immediateRender: false }, lineIn);
          tl.set(line.el, { autoAlpha: 0 }, lineOut);
          line.words.forEach(function (w) {
            var el = document.getElementById('cw-' + w.index);
            tl.to(el, { color: 'var(--t-ink, #fff4fa)', duration: 0.06, ease: 'none' }, Math.max(0, w.start));
            tl.to(el, { color: 'var(--t-soft, #a58fb8)', duration: 0.18, ease: 'none' }, Math.max(0.06, w.end));
          });
        });

        window.__timelines = window.__timelines || {};
        window.__timelines['scripture-short'] = tl;

        window.__verifyVerse = function () {
          var rendered = document.getElementById('verse-text').textContent || '';
          var norm = function (s) {
            return s.normalize('NFC').replace(/[﻿­‎‏‪-‮⁦-⁩]/g, '').replace(/\s+/g, ' ').trim();
          };
          return norm(rendered) === norm(spec.passage.text);
        };
      })();
    </script>
  </body>
</html>
